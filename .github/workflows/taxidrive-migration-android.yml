name: TaxiDrive Android migration build

on:
  workflow_dispatch:
  push:
    branches:
      - migration-original-app-backend
    paths:
      - "TaxiDrive_v2_beta/**"
      - ".github/workflows/taxidrive-migration-android.yml"

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make Gradle wrapper executable
        working-directory: TaxiDrive_v2_beta
        run: chmod +x ./gradlew
      - name: Build original app debug variant
        working-directory: TaxiDrive_v2_beta
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxidrive-debug-apk
          path: TaxiDrive_v2_beta/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
