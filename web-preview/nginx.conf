server {
    listen 80;
    server_name _;

    # Página informativa de TaxiDrive
    root /usr/share/nginx/html;
    index index.html;

    # APK compilada (montada solo lectura en /apk)
    location /apk/ {
        alias /apk/;
        autoindex off;
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=TaxiDrive-debug.apk";
    }
}
