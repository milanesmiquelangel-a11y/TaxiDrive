services:
  web-preview:
    # TaxiDrive es una app Android nativa sin frontend web; este servicio sirve
    # una página informativa y la APK para que la vista previa de Base44 (puerto
    # 3000) no quede en carga infinita y permita instalar la app en un teléfono.
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./web-preview:/usr/share/nginx/html:ro
      - ./web-preview/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./TaxiDrive_v2_beta/app/build/outputs/apk/debug:/apk:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  apk-builder:
    # Servicio de un solo uso (compila la APK y termina con exit 0). Con el
    # perfil "apk" no arranca con `up -d`, así el validador de la plataforma
    # no lo interpreta como fallo; se ejecuta explícitamente con:
    #   docker compose -f docker-compose.base44.yml --profile apk run --rm apk-builder
    profiles: ["apk"]
    build:
      context: ./TaxiDrive_v2_beta
      dockerfile: Dockerfile.build
    volumes:
      - ./TaxiDrive_v2_beta:/app
      - apk-gradle-cache:/root/.gradle
    working_dir: /app
    command: >
      bash -c "
      chmod +x gradlew &&
      ./gradlew assembleDebug --no-daemon --stacktrace
      "
    environment:
      - GRADLE_OPTS=-Xmx2048m -Dorg.gradle.daemon=false

volumes:
  apk-gradle-cache:
